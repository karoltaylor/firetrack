services:
  postgres:
    image: postgres:16-alpine
    container_name: firetrack-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: firetrack
      POSTGRES_PASSWORD: firetrack_local
      POSTGRES_DB: firetrack
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: firetrack-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
